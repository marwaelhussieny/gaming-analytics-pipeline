# Copy this to ~/.dbt/profiles.yml and fill in your real values.
# NEVER commit your actual profiles.yml — it's already in .gitignore.

gaming_analytics:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: TRANSFORMER
      database: GAMING_ANALYTICS
      warehouse: COMPUTE_WH
      schema: dev
      threads: 4
